{{ define "pages.login" }}
{{ template "head" . }}
<div class="flex justify-center">
    <div class="min-w-[400px] w-[25vw] text-center">
        <h1 class="text-2xl my-5 text-gray-800">Login</h1>
        <h3 class="text-red-500">{{ .Data.Message }}</h3>
        <form method="post" class="mt-5">
            <div class="flex bg-gray-100 mb-4 rounded">
                <div class="flex-none p-2"><i class="fas fa-user-circle"></i></div>
                <input class="outline-none flex-auto" type="text" name="username" placeholder="Username" required/>
            </div>
            <div class="flex bg-gray-100 mb-4 rounded">
                <div class="flex-none p-2"><i class="fas fa-lock"></i></div>
                <input class="outline-none flex-auto" type="password" name="password" placeholder="Password" required/>
            </div>
            <button type="submit" class="bg-primary text-white py-2 px-10 rounded cursor-pointer"> Login </button>
        </form>
    </div>
</div>
{{ template "end" . }}
{{ end }}
